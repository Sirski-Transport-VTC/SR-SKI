<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sirski Member Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#11151b;border:1px solid #29313d;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}.logo{width:62px;height:62px;object-fit:contain;border-radius:14px}h1{margin:18px 0 6px;font-size:30px}p{color:#9da8b8;line-height:1.5;font-size:14px}label{display:block;margin-top:16px;font-size:12px;font-weight:800;color:#cdd5df}input{width:100%;margin-top:7px;padding:14px;border-radius:11px;border:1px solid #344054;background:#090c11;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#f2c300;color:#080808;font-weight:900;cursor:pointer}a{color:#f2c300;text-decoration:none}.row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px}.back{display:inline-block;margin-top:20px;color:#aeb8c6;font-size:13px}#msg{min-height:24px;margin-top:14px;font-size:13px;color:#d7e0ec}</style></head><body><div class="box"><img class="logo" src="./sirski-logo.png" alt="Sirski Transport"><h1>SIRSKI MEMBER LOGIN</h1><p>Sign in to your Sirski Transport member account to view your Friday Spinner points and driver tools.</p><label>SIRSKI LOGIN EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="name@sirski-transport.com"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">SIGN IN</button><div class="row"><a href="./member-forgot-password.html">Forgot password?</a><a href="./">Main website</a></div><div id="msg"></div><p style="margin-top:14px;font-size:12px;color:#8793a3">Your @sirski-transport.com address is your Sirski login identity. It does not need to be a mailbox.</p><a class="back" href="./">← Back to main website</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://smlomuibfgezvkmpvstk.supabase.co","sb_publishable_VmMmKh9_GHt9qqD6UXpzqw_Z3raeke-");
const msg=document.getElementById("msg");

function getAuthType(){
  const hash=new URLSearchParams((location.hash||"").replace(/^#/,""));
  const query=new URLSearchParams(location.search||"");
  return (hash.get("type")||query.get("type")||"").toLowerCase();
}
function isInviteFlow(){
  const type=getAuthType();
  return type==="invite" || type==="recovery" || type==="signup";
}
async function goAfterLogin(){
  try{
    const {data,error}=await sb.functions.invoke("admin",{body:{action:"get_admin_context"}});
    if(!error && data && data.is_master===true) {
      location.replace("./admin.html");
      return;
    }
    if(!error && data && data.email && data.active===true){
      location.replace("./admin.html");
      return;
    }
  }catch(_){}
  location.replace("./member-dashboard.html");
}
function showInvitePasswordForm(){
  const box=document.querySelector(".box");
  if(!box) return;
  const login=document.getElementById("login");
  const email=document.getElementById("email");
  const password=document.getElementById("password");
  if(login) login.style.display="none";
  if(email) email.style.display="none";
  if(password) password.style.display="none";

  if(!document.getElementById("invitePanel")){
    const panel=document.createElement("div");
    panel.id="invitePanel";
    panel.innerHTML='<label>NEW PASSWORD</label><input id="invitePassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"><label>CONFIRM NEW PASSWORD</label><input id="inviteConfirm" type="password" autocomplete="new-password" placeholder="Repeat password"><button id="setInvitePassword">SET PASSWORD & CONTINUE</button>';
    const rows=box.querySelector(".row");
    box.insertBefore(panel,rows||null);
    document.getElementById("setInvitePassword").onclick=async()=>{
      const a=document.getElementById("invitePassword").value;
      const b=document.getElementById("inviteConfirm").value;
      if(a.length<6){msg.textContent="Password must be at least 6 characters.";return}
      if(a!==b){msg.textContent="Passwords do not match.";return}
      msg.textContent="Setting password...";
      const {error}=await sb.auth.updateUser({password:a});
      if(error){msg.textContent=error.message;return}
      msg.textContent="Password set successfully. Opening your account...";
      await goAfterLogin();
    };
  }
}
async function initialize(){
  const {data:{session}}=await sb.auth.getSession();
  if(isInviteFlow()){
    if(session){showInvitePasswordForm();return}
  }
  if(session){await goAfterLogin()}
}
initialize().catch(()=>{});

document.getElementById("login").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){msg.textContent="Please enter your email and password.";return}
  msg.textContent="Signing in...";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg.textContent=error.message;return}
  await goAfterLogin();
};

sb.auth.onAuthStateChange(async(event,session)=>{
  if(!session)return;
  if(isInviteFlow()){
    showInvitePasswordForm();
    return;
  }
  if(event==="SIGNED_IN" || event==="INITIAL_SESSION") await goAfterLogin();
});
</script><script>const sb=supabase.createClient("https://smlomuibfgezvkmpvstk.supabase.co","sb_publishable_VmMmKh9_GHt9qqD6UXpzqw_Z3raeke-"),msg=document.getElementById("msg");async function goAfterLogin(){try{const {data,error}=await sb.functions.invoke("admin",{body:{action:"get_admin_context"}});if(!error&&data&&!data.error){location.replace("./admin.html");return}}catch(_){}location.replace("./member-dashboard.html")}(async()=>{const {data}=await sb.auth.getSession();if(data.session){await goAfterLogin()}})();document.getElementById("login").onclick=async()=>{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password){msg.textContent="Please enter your Sirski email and password.";return}msg.textContent="Signing in...";const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return}await goAfterLogin()};</script></body></html>
