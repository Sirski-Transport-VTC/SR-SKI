<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sirski Member Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
.box{width:min(440px,100%);background:#11151b;border:1px solid #29313d;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}
.logo{width:62px;height:62px;object-fit:contain;border-radius:14px}h1{margin:18px 0 6px;font-size:30px}p{color:#9da8b8;line-height:1.5;font-size:14px}label{display:block;margin-top:16px;font-size:12px;font-weight:800;color:#cdd5df}input{width:100%;margin-top:7px;padding:14px;border-radius:11px;border:1px solid #344054;background:#090c11;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#f2c300;color:#080808;font-weight:900;cursor:pointer}a{color:#f2c300;text-decoration:none}.row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px}.row a{color:#f2c300}.back{display:inline-block;margin-top:20px;color:#aeb8c6;font-size:13px}#msg{min-height:24px;margin-top:14px;font-size:13px;color:#d7e0ec}
</style></head><body><div class="box">
<img class="logo" src="./sirski-logo.png" alt="Sirski Transport">
<h1>SIRSKI MEMBER LOGIN</h1><p>Sign in to your Sirski Transport member account to view your Friday Spinner points and driver tools.</p>
<label>SIRSKI LOGIN EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="name@sirski-transport.com">
<label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="login">SIGN IN</button>
<div class="row"><a href="./member-forgot-password.html">Forgot password?</a><a href="./">Main website</a></div>
<div id="msg"></div>
<p style="margin-top:14px;font-size:12px;color:#8793a3">Your @sirski-transport.com address is your Sirski login identity. It does not need to be a mailbox.</p>
<a class="back" href="./">← Back to main website</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://smlomuibfgezvkmpvstk.supabase.co", SB_KEY="sb_publishable_VmMmKh9_GHt9qqD6UXpzqw_Z3raeke-";
const sb=supabase.createClient(SB_URL,SB_KEY), msg=document.getElementById("msg");
document.getElementById("login").onclick=async()=>{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password){msg.textContent="Please enter your Sirski email and password.";return}msg.textContent="Signing in...";const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return}location.href="./member-dashboard.html"};
</script></body></html>
