<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Sirski Transport VTC</title>
  <link rel="icon" href="./sirski-logo.png">
  <style>
    :root{--bg:#080808;--panel:#111;--line:#292929;--text:#f4f4f4;--muted:#9b9b9b;--yellow:#f5c400;--yellow2:#ffe36a}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#1b1b1b 0,#080808 55%);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(480px,100%);background:rgba(17,17,17,.96);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .brand{text-align:center;margin-bottom:26px}.brand img{width:82px;height:82px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 14px}.brand h1{font-size:22px;letter-spacing:2px;margin:0}.brand h1 span{color:var(--yellow)}.brand p{color:var(--muted);font-size:13px;margin:9px 0 0}
    h2{font-size:28px;margin:0 0 8px;text-align:center}.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}
    label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;margin:16px 0 7px;text-transform:uppercase}input{width:100%;padding:14px 15px;border:1px solid #343434;background:#090909;color:#fff;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:var(--yellow)}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--yellow);color:#090909;font-size:15px;font-weight:800;letter-spacing:.5px;cursor:pointer}button:hover{background:var(--yellow2)}button:disabled{opacity:.6;cursor:not-allowed}
    .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:9px;font-size:13px;line-height:1.45}.msg.show{display:block}.success{background:#112313;border:1px solid #315c35;color:#bce8c1}.error{background:#281212;border:1px solid #6a3030;color:#ffbaba}.back{display:block;text-align:center;margin-top:20px;color:var(--muted);font-size:13px;text-decoration:none}.back:hover{color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="./sirski-logo.png" alt="Sirski Transport logo">
      <h1>SIRSKI TRANSPORT <span>VTC</span></h1>
      <p>Driven by Passion. Built on Trust.</p>
    </div>
    <h2>Reset Password</h2>
    <p class="intro">Enter your new password below. This page is only available through a valid Supabase password-reset link.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again">
      <button id="submitBtn" type="submit">CHANGE PASSWORD</button>
    </form>
    <div id="message" class="msg"></div>
    <a class="back" href="./index.html">← Back to Sirski Transport</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./spinner/config.js"></script>
  <script>
    const { createClient } = supabase;
    const client = createClient(window.SIRSKI_CONFIG.SUPABASE_URL, window.SIRSKI_CONFIG.SUPABASE_ANON_KEY);
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('message');

    function show(text, type){ msg.textContent=text; msg.className='msg show '+type; }

    // The reset email creates a temporary authenticated recovery session.
    // Supabase recommends updating the password with auth.updateUser().
    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        form.style.display='block';
      }
    });

    (async () => {
      const { data } = await client.auth.getSession();
      if (data.session) return;
      // If the URL does not contain a recovery token/code, don't expose a false success state.
      const hasRecoveryData = location.hash.includes('access_token=') || location.search.includes('code=');
      if (!hasRecoveryData) show('Please open this page using the password-reset link from your email.', 'error');
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8) return show('Password must be at least 8 characters.', 'error');
      if (password !== confirm) return show('The passwords do not match.', 'error');
      btn.disabled = true;
      btn.textContent = 'UPDATING...';
      const { error } = await client.auth.updateUser({ password });
      if (error) {
        show(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'CHANGE PASSWORD';
        return;
      }
      show('Password changed successfully. You can now sign in to the Admin Panel with your new password.', 'success');
      form.reset();
      btn.textContent = 'PASSWORD CHANGED';
      setTimeout(() => { window.location.href = './spinner/admin.html'; }, 1800);
    });
  </script>
</body>
</html>
