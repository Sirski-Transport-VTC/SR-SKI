<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Sirski Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(470px,100%);background:#11151b;border:1px solid #29313d;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}.logo{width:62px;height:62px;object-fit:contain;border-radius:14px}h1{margin:18px 0 6px;font-size:28px}p{color:#9da8b8;line-height:1.55;font-size:14px}label{display:block;margin-top:18px;font-size:12px;font-weight:800;color:#cdd5df}input{width:100%;margin-top:7px;padding:14px;border-radius:11px;border:1px solid #344054;background:#090c11;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#f2c300;color:#080808;font-weight:900;cursor:pointer}.msg{min-height:24px;margin-top:15px;font-size:13px}.success{color:#8fe0a0}.error{color:#ff8d8d}a{color:#f2c300;text-decoration:none}.back{display:inline-block;margin-top:20px;color:#aeb8c6;font-size:13px}
</style></head><body><div class="box"><img class="logo" src="./sirski-logo.png" alt="Sirski Transport"><h1>RESET SIRSKI PASSWORD</h1><p>Create a new password for your Sirski member account.</p><label>NEW PASSWORD</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"><label>CONFIRM NEW PASSWORD</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat new password"><button id="reset">CHANGE PASSWORD</button><div id="msg" class="msg"></div><a class="back" href="./member-login.html">← Back to member login</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://smlomuibfgezvkmpvstk.supabase.co",SB_KEY="sb_publishable_VmMmKh9_GHt9qqD6UXpzqw_Z3raeke-",sb=supabase.createClient(SB_URL,SB_KEY),msg=document.getElementById("msg"),token=new URLSearchParams(location.search).get("token");
document.getElementById("reset").onclick=async()=>{const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(!token){msg.textContent="This reset link is missing or invalid.";msg.className="msg error";return}if(p.length<6){msg.textContent="Password must be at least 6 characters.";msg.className="msg error";return}if(p!==c){msg.textContent="Passwords do not match.";msg.className="msg error";return}msg.textContent="Updating password...";msg.className="msg";document.getElementById("reset").disabled=true;try{const {data,error}=await sb.functions.invoke("member-recovery",{body:{action:"complete_password_reset",token,new_password:p}});if(error)throw error;if(data?.error)throw new Error(data.error);msg.textContent=data?.message||"Password changed successfully.";msg.className="msg success";document.getElementById("password").value=document.getElementById("confirm").value="";document.getElementById("reset").style.display="none"}catch(e){msg.textContent=e?.message||"This reset link is invalid or expired.";msg.className="msg error";document.getElementById("reset").disabled=false}};
</script></body></html>
