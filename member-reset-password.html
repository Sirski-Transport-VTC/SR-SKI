<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Sirski Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#11151b;border:1px solid #29313d;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}.logo{width:62px;height:62px;object-fit:contain;border-radius:14px}h1{margin:18px 0 6px;font-size:28px}p{color:#9da8b8;line-height:1.5;font-size:14px}label{display:block;margin-top:16px;font-size:12px;font-weight:800;color:#cdd5df}input{width:100%;margin-top:7px;padding:14px;border-radius:11px;border:1px solid #344054;background:#090c11;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#f2c300;color:#080808;font-weight:900;cursor:pointer}a{color:#f2c300;text-decoration:none}#msg{min-height:24px;margin-top:14px;font-size:13px;color:#d7e0ec}
</style></head><body><div class="box"><img class="logo" src="./sirski-logo.png" alt="Sirski Transport"><h1>RESET SIRSKI PASSWORD</h1><p>Set a new password for your Sirski Transport member account.</p>
<label>NEW PASSWORD</label><input id="p1" type="password" autocomplete="new-password" placeholder="At least 6 characters">
<label>CONFIRM NEW PASSWORD</label><input id="p2" type="password" autocomplete="new-password" placeholder="Repeat new password">
<button id="save">SET NEW PASSWORD</button><div id="msg"></div><p><a href="./member-login.html">← Back to member login</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://smlomuibfgezvkmpvstk.supabase.co","sb_publishable_VmMmKh9_GHt9qqD6UXpzqw_Z3raeke-");
const msg=document.getElementById("msg");
sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY") msg.textContent="Enter your new password below.";});
document.getElementById("save").onclick=async()=>{
 const a=document.getElementById("p1").value,b=document.getElementById("p2").value;
 if(a.length<6){msg.textContent="Password must be at least 6 characters.";return}
 if(a!==b){msg.textContent="Passwords do not match.";return}
 msg.textContent="Updating password...";
 const {error}=await sb.auth.updateUser({password:a});
 if(error){msg.textContent=error.message;return}
 msg.textContent="Password updated successfully. Redirecting...";
 setTimeout(()=>location.href="./member-dashboard.html",1200);
};
</script></body></html>
